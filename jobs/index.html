<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Job Applications — Hashwanth Ghanta</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #22263a;
    --border: #2e3352;
    --text: #e8eaf0;
    --muted: #7b82a0;
    --applied: #3b82f6;
    --applied-bg: #1e2a42;
    --confirmed: #10b981;
    --confirmed-bg: #0d2d22;
    --interview: #f59e0b;
    --interview-bg: #2d2010;
    --rejected: #ef4444;
    --rejected-bg: #2d1515;
    --ghosted: #6b7280;
    --ghosted-bg: #1e2028;
    --font: 'Inter', system-ui, -apple-system, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    min-height: 100vh;
    padding: 24px 16px;
  }

  header {
    max-width: 1200px;
    margin: 0 auto 32px;
  }

  .header-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 6px;
  }

  h1 {
    font-size: clamp(1.25rem, 4vw, 1.75rem);
    font-weight: 700;
    letter-spacing: -0.02em;
  }

  .subtitle {
    color: var(--muted);
    font-size: 0.85rem;
    margin-top: 4px;
  }

  .last-updated {
    font-size: 0.75rem;
    color: var(--muted);
    background: var(--surface2);
    border: 1px solid var(--border);
    padding: 4px 10px;
    border-radius: 20px;
    white-space: nowrap;
  }

  /* STATS ROW */
  .stats {
    max-width: 1200px;
    margin: 0 auto 28px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 12px;
  }

  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px 16px;
    text-align: center;
    cursor: pointer;
    transition: transform 0.15s, border-color 0.15s;
    user-select: none;
  }

  .stat-card:hover { transform: translateY(-2px); }
  .stat-card.active { border-color: var(--accent-color, var(--border)); }

  .stat-card .num {
    font-size: 2rem;
    font-weight: 800;
    line-height: 1;
    margin-bottom: 6px;
  }

  .stat-card .label {
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .stat-all   .num { color: var(--text); }
  .stat-applied   .num { color: var(--applied); }
  .stat-confirmed .num { color: var(--confirmed); }
  .stat-interview .num { color: var(--interview); }
  .stat-rejected  .num { color: var(--rejected); }

  /* FILTER BAR */
  .controls {
    max-width: 1200px;
    margin: 0 auto 20px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
  }

  .search-wrap {
    flex: 1;
    min-width: 200px;
    position: relative;
  }

  .search-wrap input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-size: 0.875rem;
    padding: 9px 14px 9px 36px;
    outline: none;
    transition: border-color 0.15s;
  }

  .search-wrap input:focus { border-color: var(--applied); }

  .search-wrap svg {
    position: absolute;
    left: 11px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    pointer-events: none;
  }

  select {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-size: 0.875rem;
    padding: 9px 14px;
    outline: none;
    cursor: pointer;
  }

  /* TABLE */
  .table-wrap {
    max-width: 1200px;
    margin: 0 auto;
    overflow-x: auto;
    border-radius: 16px;
    border: 1px solid var(--border);
    background: var(--surface);
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.875rem;
  }

  thead tr {
    border-bottom: 1px solid var(--border);
    background: var(--surface2);
  }

  th {
    padding: 12px 16px;
    text-align: left;
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    cursor: pointer;
    white-space: nowrap;
    user-select: none;
  }

  th:hover { color: var(--text); }

  td {
    padding: 13px 16px;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
  }

  tr:last-child td { border-bottom: none; }

  tbody tr {
    transition: background 0.1s;
    cursor: default;
  }

  tbody tr:hover { background: var(--surface2); }

  .company-name {
    font-weight: 600;
    color: var(--text);
    white-space: nowrap;
  }

  .role-text {
    color: var(--muted);
    font-size: 0.8rem;
    margin-top: 2px;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    white-space: nowrap;
  }

  .badge-Applied   { background: var(--applied-bg);   color: var(--applied);   }
  .badge-Confirmed { background: var(--confirmed-bg); color: var(--confirmed); }
  .badge-Interview { background: var(--interview-bg); color: var(--interview); }
  .badge-Rejected  { background: var(--rejected-bg);  color: var(--rejected);  }
  .badge-Ghosted   { background: var(--ghosted-bg);   color: var(--ghosted);   }

  .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: currentColor;
    flex-shrink: 0;
  }

  .agent-chip {
    font-size: 0.7rem;
    padding: 2px 8px;
    border-radius: 6px;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--muted);
    white-space: nowrap;
  }

  .date-text {
    color: var(--muted);
    font-size: 0.8rem;
    white-space: nowrap;
  }

  .notes-text {
    color: var(--muted);
    font-size: 0.78rem;
    max-width: 220px;
    line-height: 1.4;
  }

  .no-results {
    text-align: center;
    padding: 48px;
    color: var(--muted);
  }

  /* MOBILE CARDS */
  .card-list {
    max-width: 1200px;
    margin: 0 auto;
    display: none;
    flex-direction: column;
    gap: 12px;
  }

  .app-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
  }

  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
    margin-bottom: 8px;
  }

  .card-footer {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--border);
  }

  /* PROGRESS BAR */
  .progress-section {
    max-width: 1200px;
    margin: 0 auto 24px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px 20px;
  }

  .progress-label {
    display: flex;
    justify-content: space-between;
    font-size: 0.78rem;
    color: var(--muted);
    margin-bottom: 8px;
  }

  .progress-bar {
    height: 8px;
    background: var(--surface2);
    border-radius: 4px;
    overflow: hidden;
    display: flex;
  }

  .progress-seg {
    height: 100%;
    transition: width 0.4s ease;
  }

  @media (max-width: 640px) {
    .table-wrap { display: none; }
    .card-list { display: flex; }
    .stats { grid-template-columns: repeat(3, 1fr); }
  }
</style>
</head>
<body>

<header>
  <div class="header-top">
    <div>
      <h1>Job Applications</h1>
      <div class="subtitle">Hashwanth Ghanta · M.Sc. Digital Engineering · OVGU Magdeburg</div>
    </div>
    <div class="last-updated" id="lastUpdated">Updated: 2026-06-02</div>
  </div>
</header>

<!-- STATS -->
<div class="stats">
  <div class="stat-card stat-all" onclick="filterStatus('')" id="card-all">
    <div class="num" id="count-all">0</div>
    <div class="label">Total</div>
  </div>
  <div class="stat-card stat-applied" onclick="filterStatus('Applied')" id="card-Applied">
    <div class="num" id="count-Applied">0</div>
    <div class="label">Applied</div>
  </div>
  <div class="stat-card stat-confirmed" onclick="filterStatus('Confirmed')" id="card-Confirmed">
    <div class="num" id="count-Confirmed">0</div>
    <div class="label">Confirmed</div>
  </div>
  <div class="stat-card stat-interview" onclick="filterStatus('Interview')" id="card-Interview">
    <div class="num" id="count-Interview">0</div>
    <div class="label">Interview</div>
  </div>
  <div class="stat-card stat-rejected" onclick="filterStatus('Rejected')" id="card-Rejected">
    <div class="num" id="count-Rejected">0</div>
    <div class="label">Rejected</div>
  </div>
</div>

<!-- PROGRESS BAR -->
<div class="progress-section">
  <div class="progress-label">
    <span>Application Pipeline</span>
    <span id="progressText"></span>
  </div>
  <div class="progress-bar" id="progressBar"></div>
</div>

<!-- CONTROLS -->
<div class="controls">
  <div class="search-wrap">
    <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
      <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
    </svg>
    <input type="text" id="searchInput" placeholder="Search company, role, notes…" oninput="render()">
  </div>
  <select id="agentFilter" onchange="render()">
    <option value="">All agents</option>
    <option value="Claude">Claude</option>
    <option value="kiro">kiro</option>
    <option value="Gemini">Gemini</option>
    <option value="antigravity">antigravity</option>
  </select>
  <select id="sortSelect" onchange="render()">
    <option value="date-desc">Newest first</option>
    <option value="date-asc">Oldest first</option>
    <option value="company">Company A–Z</option>
    <option value="status">Status</option>
  </select>
</div>

<!-- TABLE (desktop) -->
<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th>Company / Role</th>
        <th>Status</th>
        <th>Date</th>
        <th>Agent</th>
        <th>Notes</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>
</div>

<!-- CARDS (mobile) -->
<div class="card-list" id="cardList"></div>

<script>
const DATA = [
  {"date":"2026-05-22","company":"ABOUT YOU","role":"Working Student LAYBELS Operations & Finance","batch":"22:05:26","agent":"Claude","status":"Rejected","updated":"2026-06-01","notes":"Rejection from Caroline. No contact email found."},
  {"date":"2026-05-22","company":"Bosch","role":"Working Student System Team Dev/Data-Ops Tools","batch":"22:05:26","agent":"Claude","status":"Applied","updated":"2026-05-22","notes":"On-site Hildesheim ~120km from Magdeburg"},
  {"date":"2026-05-22","company":"1KOMMA5°","role":"Working Student Data Science Forecasting","batch":"22:05:26","agent":"Claude","status":"Applied","updated":"2026-05-22","notes":"Strong natural fit"},
  {"date":"2026-05-22","company":"Netlight","role":"Working Student","batch":"22:05:26","agent":"Claude","status":"Applied","updated":"2026-05-22","notes":""},
  {"date":"2026-05-22","company":"QuantumSystems","role":"Working Student PM","batch":"22:05:26","agent":"Claude","status":"Applied","updated":"2026-05-22","notes":""},
  {"date":"2026-05-22","company":"QuantumSystems","role":"Working Student SWE","batch":"22:05:26","agent":"Claude","status":"Applied","updated":"2026-05-22","notes":""},
  {"date":"2026-05-22","company":"Redcare Pharmacy","role":"Working Student","batch":"22:05:26","agent":"Claude","status":"Applied","updated":"2026-05-22","notes":"Italian language gap"},
  {"date":"2026-05-22","company":"ScalableCapital","role":"Working Student Data Governance","batch":"22:05:26","agent":"Claude","status":"Applied","updated":"2026-05-22","notes":"Interview prep docs ready"},
  {"date":"2026-05-22","company":"TripleTen","role":"Working Student","batch":"22:05:26","agent":"Claude","status":"Applied","updated":"2026-05-22","notes":"Long-shot"},
  {"date":"2026-05-22","company":"idealo","role":"Working Student","batch":"22:05:26","agent":"Claude","status":"Applied","updated":"2026-05-22","notes":"French language gap"},
  {"date":"2026-05-22","company":"neoBIM","role":"Platform Engineer","batch":"22:05:26","agent":"Claude","status":"Applied","updated":"2026-05-22","notes":"Seniority stretch"},
  {"date":"2026-05-31","company":"adjoe","role":"Working Student","batch":"kiro Old Applied","agent":"kiro","status":"Rejected","updated":"2026-06-02","notes":"Position closed — not profile rejection"},
  {"date":"2026-05-31","company":"ilert GmbH","role":"Working Student Frontend Engineer","batch":"31:05:26","agent":"kiro","status":"Rejected","updated":"2026-06-02","notes":"No contact email found"},
  {"date":"2026-05-31","company":"SAP","role":"AI-based Quality Evaluation (427206)","batch":"31:05:26","agent":"Claude","status":"Confirmed","updated":"2026-06-01","notes":"Confirmation received"},
  {"date":"2026-05-31","company":"SAP","role":"AI Developer @ Signavio (454091)","batch":"31:05:26","agent":"Claude","status":"Confirmed","updated":"2026-06-01","notes":"Confirmation received"},
  {"date":"2026-05-31","company":"SAP","role":"Experience Center Storytelling (452678)","batch":"31:05:26","agent":"Claude","status":"Confirmed","updated":"2026-06-01","notes":"Confirmation received"},
  {"date":"2026-05-31","company":"SAP","role":"Engagement Lead AI Vision (449633)","batch":"31:05:26","agent":"Claude","status":"Confirmed","updated":"2026-06-01","notes":"Confirmation received"},
  {"date":"2026-05-31","company":"SAP","role":"UXUA Communications (451479)","batch":"31:05:26","agent":"Claude","status":"Confirmed","updated":"2026-06-01","notes":"Confirmation received"},
  {"date":"2026-05-31","company":"SAP","role":"Team Assistance Strategic Innovation (450837)","batch":"31:05:26","agent":"Claude","status":"Confirmed","updated":"2026-06-01","notes":"Confirmation received"},
  {"date":"2026-05-31","company":"Airbus Defence","role":"Working Student Computer Vision","batch":"31:05:26","agent":"kiro","status":"Applied","updated":"2026-05-31","notes":"Hybrid — Manching"},
  {"date":"2026-05-31","company":"Allianz","role":"AI Office Working Student","batch":"31:05:26","agent":"kiro","status":"Applied","updated":"2026-05-31","notes":""},
  {"date":"2026-05-31","company":"Allianz","role":"Frontend Web Working Student","batch":"31:05:26","agent":"kiro","status":"Applied","updated":"2026-05-31","notes":""}
];

const STATUS_ORDER = ["Interview","Confirmed","Applied","Rejected","Ghosted"];
let activeFilter = "";

function counts() {
  const c = { all: DATA.length };
  DATA.forEach(r => { c[r.status] = (c[r.status] || 0) + 1; });
  return c;
}

function initStats() {
  const c = counts();
  document.getElementById("count-all").textContent = c.all;
  ["Applied","Confirmed","Interview","Rejected"].forEach(s => {
    document.getElementById("count-" + s).textContent = c[s] || 0;
  });
  // progress bar
  const total = c.all;
  const segs = [
    { status: "Interview", color: "#f59e0b" },
    { status: "Confirmed", color: "#10b981" },
    { status: "Applied",   color: "#3b82f6" },
    { status: "Rejected",  color: "#ef4444" },
  ];
  const bar = document.getElementById("progressBar");
  bar.innerHTML = segs.map(s => {
    const pct = ((c[s.status] || 0) / total * 100).toFixed(1);
    return `<div class="progress-seg" style="width:${pct}%;background:${s.color}" title="${s.status}: ${c[s.status]||0}"></div>`;
  }).join("");
  document.getElementById("progressText").textContent =
    `${c.Interview||0} interview · ${c.Confirmed||0} confirmed · ${c.Applied||0} pending · ${c.Rejected||0} rejected`;
}

function filterStatus(s) {
  activeFilter = activeFilter === s ? "" : s;
  document.querySelectorAll(".stat-card").forEach(el => el.classList.remove("active"));
  if (activeFilter) {
    const id = activeFilter ? "card-" + activeFilter : "card-all";
    document.getElementById(id)?.classList.add("active");
  } else {
    document.getElementById("card-all").classList.add("active");
  }
  render();
}

function getFiltered() {
  const q = document.getElementById("searchInput").value.toLowerCase();
  const ag = document.getElementById("agentFilter").value;
  let rows = DATA.filter(r => {
    if (activeFilter && r.status !== activeFilter) return false;
    if (ag && r.agent !== ag) return false;
    if (q && !`${r.company} ${r.role} ${r.notes} ${r.agent}`.toLowerCase().includes(q)) return false;
    return true;
  });
  const sort = document.getElementById("sortSelect").value;
  if (sort === "date-desc") rows.sort((a,b) => b.date.localeCompare(a.date));
  else if (sort === "date-asc") rows.sort((a,b) => a.date.localeCompare(b.date));
  else if (sort === "company") rows.sort((a,b) => a.company.localeCompare(b.company));
  else if (sort === "status") rows.sort((a,b) => STATUS_ORDER.indexOf(a.status) - STATUS_ORDER.indexOf(b.status));
  return rows;
}

function badge(status) {
  return `<span class="badge badge-${status}"><span class="dot"></span>${status}</span>`;
}

function render() {
  const rows = getFiltered();
  // Table
  const tbody = document.getElementById("tableBody");
  if (rows.length === 0) {
    tbody.innerHTML = `<tr><td colspan="5" class="no-results">No applications match your filters.</td></tr>`;
  } else {
    tbody.innerHTML = rows.map(r => `
      <tr>
        <td>
          <div class="company-name">${r.company}</div>
          <div class="role-text">${r.role}</div>
        </td>
        <td>${badge(r.status)}</td>
        <td><span class="date-text">${r.date}</span></td>
        <td><span class="agent-chip">${r.agent}</span></td>
        <td><span class="notes-text">${r.notes || "—"}</span></td>
      </tr>`).join("");
  }
  // Cards
  const cardList = document.getElementById("cardList");
  cardList.innerHTML = rows.map(r => `
    <div class="app-card">
      <div class="card-header">
        <div>
          <div class="company-name">${r.company}</div>
          <div class="role-text">${r.role}</div>
        </div>
        ${badge(r.status)}
      </div>
      ${r.notes ? `<div class="notes-text">${r.notes}</div>` : ""}
      <div class="card-footer">
        <span class="agent-chip">${r.agent}</span>
        <span class="date-text">${r.date}</span>
      </div>
    </div>`).join("");
}

initStats();
filterStatus("");
render();
</script>
</body>
</html>
